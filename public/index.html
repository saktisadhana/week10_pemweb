<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nama Mahasiswa</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Daftar Nama Mahasiswa</h1>
    <form id="form-nama">
      <label for="nama">Nama mahasiswa</label>
      <input id="nama" name="nama" required>
      <div class="form-actions">
        <button id="tombol-simpan" type="submit">Tambah nama</button>
        <button id="tombol-batal" class="btn-batal" type="button" hidden>Batal</button>
      </div>
    </form>
    <p id="pesan" role="status"></p>
    <div class="tabel-wrap">
      <table class="tabel">
        <thead><tr><th>ID</th><th>Nama</th><th>Aksi</th></tr></thead>
        <tbody id="daftar-nama"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
